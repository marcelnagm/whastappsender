version: '3.8'

services:
  # MONITORAMENTO E GESTÃO: REDIS
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - evolution_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MOTOR PHP (Site/API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meu-php:latest
    container_name: whatsapp_app_php
    restart: always
    working_dir: /var/www
    entrypoint: []
    ports:
      - "9000"
    volumes:
      - ./app:/var/www
    networks:
      - evolution_network
    depends_on:
      - mysql
    logging:
     driver: "json-file"
     options:
       max-size: "10m"
       max-file: "3"

  # SERVIDOR WEB (Nginx)
  nginx:
    image: nginx:alpine
    container_name: whatsapp_app_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443" 
      - "9000:9000" 
      - "8080:8080"
      - "8081:8081"
      - "8443:8443"   # Typebot builder (editor)
      - "8444:8444"   # Typebot viewer (runs the flows)
    volumes:
      - ./app:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - evolution_network
    depends_on:
      - app
    logging:
     driver: "json-file"
     options:
       max-size: "10m"
       max-file: "3"

  # BANCO DE DADOS MYSQL (Laravel)
  mysql:
    image: mysql:8.0
    container_name: whatsapp_app_db
    restart: always
    environment:
      MYSQL_DATABASE: whatsapp_sender
      MYSQL_USER: ${DB_USERNAME:-sama}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - evolution_network

  # BANCO EVOLUTION (Postgres)
  postgres:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - evolution_network

  # EVOLUTION API (Corrigido para aguardar o Redis)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: evolution_api
    restart: always
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # secrets come from .env (never from a tracked file)
      AUTHENTICATION_API_KEY: ${WHATSAPP_APIKEY:?Set WHATSAPP_APIKEY in .env}
      DATABASE_CONNECTION_URI: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./data/evolution_instances:/evolution/instances
    networks:
      - evolution_network

  # STORAGE S3
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    ports:
      - "9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - evolution_network
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: whatsapp_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
    networks:
      - evolution_network

  # TYPEBOT (chatbot flow builder). The CRM talks to the viewer; users design flows in the builder.
  # Public URLs (through Nginx, same certificate as the app): builder https://HOST:8443  viewer https://HOST:8444
  typebot-db:
    image: postgres:16-alpine
    container_name: typebot_db
    restart: always
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: typebot
      POSTGRES_PASSWORD: ${TYPEBOT_DB_PASSWORD:?Set TYPEBOT_DB_PASSWORD in .env}
    volumes:
      - ./data/typebot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typebot -d typebot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evolution_network

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: typebot_builder
    restart: always
    depends_on:
      typebot-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://typebot:${TYPEBOT_DB_PASSWORD}@typebot-db:5432/typebot
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:?Set TYPEBOT_ENCRYPTION_SECRET in .env (32 chars)}
      NEXTAUTH_URL: ${TYPEBOT_BUILDER_URL:?Set TYPEBOT_BUILDER_URL in .env (e.g. https://sama.app.br:8443)}
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_VIEWER_URL:?Set TYPEBOT_VIEWER_URL in .env (e.g. https://sama.app.br:8444)}
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL:?Set TYPEBOT_ADMIN_EMAIL in .env}
      DISABLE_SIGNUP: ${TYPEBOT_DISABLE_SIGNUP:-false}
      SMTP_HOST: ${TYPEBOT_SMTP_HOST:-${MAIL_HOST:-}}
      SMTP_PORT: ${TYPEBOT_SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USERNAME: ${TYPEBOT_SMTP_USERNAME:-${MAIL_USERNAME:-}}
      SMTP_PASSWORD: ${TYPEBOT_SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      SMTP_SECURE: ${TYPEBOT_SMTP_SECURE:-false}
      NEXT_PUBLIC_SMTP_FROM: ${TYPEBOT_SMTP_FROM:-${MAIL_FROM_ADDRESS:-noreply@localhost}}
    networks:
      - evolution_network

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: typebot_viewer
    restart: always
    depends_on:
      typebot-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://typebot:${TYPEBOT_DB_PASSWORD}@typebot-db:5432/typebot
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:?Set TYPEBOT_ENCRYPTION_SECRET in .env (32 chars)}
      NEXTAUTH_URL: ${TYPEBOT_BUILDER_URL}
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_VIEWER_URL}
    networks:
      - evolution_network


networks:
  evolution_network:
    driver: bridge

