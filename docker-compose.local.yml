# SAMA Envios - LOCAL DEVELOPMENT stack (infrastructure only).
#
# PHP is NOT in here: you run it on your machine with `php artisan serve`, queue workers and the scheduler.
# This file starts what PHP needs around it: MySQL, Evolution API (+ its Postgres), MinIO (S3) and Mailpit (e-mail).
#
# Use it through ./start-local.sh (checks the credentials, starts the services, verifies them).
# Credentials come from the Laravel .env of this folder (compose reads it for ${...} below), so there is one source of truth.
# Only bound to 127.0.0.1: nothing here is reachable from the network.
#
# Not for production: see .docker/ and install.sh vps.
version: "3.3"

services:
  mysql:
    image: mysql:8.0
    container_name: sama_local_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-whatsapp_sender}
      MYSQL_USER: ${DB_USERNAME:-sama}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is empty in .env - run ./start-local.sh}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_dev}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=mysql_native_password"]
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Queues (db 2), cache and locks (db 0/1). The app talks to it with the pure-PHP predis client: no PHP extension needed.
  redis:
    image: redis:7-alpine
    container_name: sama_local_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  evolution-postgres:
    image: postgres:15-alpine
    container_name: sama_local_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_local_dev
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: sama_local_evolution
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WHATSAPP_PORT:-8080}:8080"
    # lets the container call PHP running on your machine (Linux needs this line; Docker Desktop has it built in)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_NAME: sama-local
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${WHATSAPP_PORT:-8080}
      CORS_ORIGIN: "*"
      CORS_METHODS: POST,GET,PUT,DELETE
      CORS_CREDENTIALS: "true"
      AUTHENTICATION_API_KEY: ${WHATSAPP_APIKEY:?WHATSAPP_APIKEY is empty in .env - run ./start-local.sh}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_local_dev@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: sama_local
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: 7
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR,WARN,INFO,WEBHOOKS
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      # Every event goes to the Laravel app started with `php artisan serve --host=0.0.0.0 --port=<APP_PORT>`
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:${APP_PORT:-8000}/api/webhook/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGING_HISTORY_SET: "true"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "true"
      CONFIG_SESSION_PHONE_CLIENT: SAMA-Envios
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      QR_CODE_TYPE: base64
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  # S3-compatible storage for campaign media (the `s3` disk of Laravel points here)
  minio:
    image: minio/minio:latest
    container_name: sama_local_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-sama_local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is empty in .env - run ./start-local.sh}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket and makes it publicly readable (Evolution downloads media by URL).
  # Exits 0 on success; a wrong access key / secret makes it fail, which ./start-local.sh reports.
  minio-setup:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: sama_local_minio_setup
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_USER: ${AWS_ACCESS_KEY_ID:-sama_local}
      MC_PASS: ${AWS_SECRET_ACCESS_KEY}
      MC_BUCKET: ${AWS_BUCKET:-ads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASS"
        mc mb --ignore-existing "local/$$MC_BUCKET"
        mc anonymous set download "local/$$MC_BUCKET"
        echo "bucket $$MC_BUCKET ready"

  # Catches every e-mail the app sends (SMTP 1025, inbox at http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: sama_local_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Optional database UI:  docker compose -f docker-compose.local.yml --profile tools up -d
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sama_local_phpmyadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-sama}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${PMA_PORT:-8082}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  redis_data:
  mysql_data:
  evolution_pg:
  evolution_instances:
  minio_data:
